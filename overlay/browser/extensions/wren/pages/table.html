<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>table</title>
  <link rel="stylesheet" href="wren.css">
  <link rel="stylesheet" href="app.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .bar { position: fixed; top: 0; left: 0; right: 0; padding: .6rem 1rem; display: flex; gap: .8rem; align-items: center; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 5; }
    .bar input { flex: 1; max-width: 22rem; }
    #desk { position: absolute; inset: 3.4rem 0 0 0; overflow: auto; }
    .paper { position: absolute; width: 11.5rem; min-height: 6rem; background: var(--card); border: 1px solid var(--line); border-radius: .8rem; padding: .7rem .8rem .6rem; cursor: grab; box-shadow: 0 4px 14px rgba(40, 25, 10, .12); user-select: none; transition: box-shadow .15s; }
    .paper:active { cursor: grabbing; box-shadow: 0 12px 30px rgba(40, 25, 10, .25); z-index: 4; }
    .paper::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: .35rem; border-radius: .8rem .8rem 0 0; background: var(--band); }
    .paper b { display: block; font-weight: 400; font-size: .95rem; line-height: 1.25; max-height: 4.8em; overflow: hidden; margin-top: .2rem; }
    .paper span { display: block; color: var(--soft); font-size: .78rem; margin-top: .3rem; }
    .paper .x { position: absolute; right: .35rem; top: .5rem; background: none; border: 0; color: var(--soft); cursor: pointer; }
    .paper.here { border-color: var(--link); }
  </style>
</head>
<body>
  <div class="bar"><b>table</b><input id="find" type="search" placeholder="find a tab"><button class="btn small alt" id="tidy">tidy up</button><span class="soft" id="n"></span></div>
  <div id="desk"></div>
  <script src="../lib/common.js"></script>
  <script src="table.js"></script>
</body>
</html>
