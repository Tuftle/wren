<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>daily digest</title>
  <link rel="stylesheet" href="wren.css">
  <link rel="stylesheet" href="app.css">
  <style>
    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); gap: 1rem; }
    iframe { width: 100%; height: 22rem; border: 1px solid var(--line); border-radius: .8rem; background: var(--bg); }
  </style>
</head>
<body>
  <main class="app" style="max-width:62rem">
    <h1 id="hello">today</h1>
    <p class="lede" id="date"></p>
    <div class="cols">
      <section class="card"><h2>weather <a id="wl" href="#">open in nook</a></h2><iframe id="weather" title="weather" referrerpolicy="no-referrer"></iframe></section>
      <section class="card"><h2>what you are watching <a id="tl" href="#">open in nook</a></h2><iframe id="today" title="today" referrerpolicy="no-referrer"></iframe></section>
      <section class="card"><h2>your inbox board</h2><ul class="list" id="inbox"></ul><p class="soft" id="inboxNote"></p></section>
      <section class="card"><h2>to do</h2><ul class="list" id="todos"></ul><p class="soft" id="todoNote"></p></section>
    </div>
  </main>
  <script src="../lib/common.js"></script>
  <script src="digest.js"></script>
</body>
</html>
